[project]
name = "personal-transcriber-backend"
version = "0.1.0"
description = "FastAPI backend for personal-transcriber"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "supabase>=2.9.0",
    "groq>=0.11.0",
    "anthropic>=0.39.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
